<!DOCTYPE html>
<html lang="nl" data-theme="dark" data-density="1">
<head>
  <meta charset="utf-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aanmelden — LeuffenDoc</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .signin { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .signin .card { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--border);
                    border-radius: var(--r-lg); padding: 28px; }
    .signin .mark { display: flex; align-items: center; gap: 11px; font-weight: 700; font-size: 18px;
                    letter-spacing: -0.02em; margin-bottom: 6px; }
    .signin .mark .logo { width: 34px; height: 34px; border-radius: var(--r-sm); display: grid;
                          place-items: center; background: var(--accent-soft); color: var(--accent); }
    .signin .mark span { color: var(--text-dim); font-weight: 600; }
    .signin p.lead { color: var(--text-dim); font-size: 13px; margin: 0 0 22px; line-height: 1.6; }
    .signin .btn { width: 100%; justify-content: center; margin-bottom: 10px; }
    .signin .sep { display: flex; align-items: center; gap: 10px; color: var(--text-faint);
                   font-size: 11.5px; margin: 16px 0; }
    .signin .sep::before, .signin .sep::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  </style>
</head>
<body>
  <div class="signin">
    <div class="card">
      <div class="mark"><span class="logo" id="mark-logo"></span> Leuffen <span>Doc</span></div>
      <p class="lead">Documentatie en wachtwoorden per klant.</p>
      <div id="methods"></div>
      <div id="msg"></div>
    </div>
  </div>
  <script src="/icons.js"></script>
  <script src="/login.js"></script>
</body>
</html>
