<!DOCTYPE html>
<html lang="nl" data-theme="dark" data-density="1">
<head>
  <meta charset="utf-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LeuffenDoc</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    /* A few rules of our own. styles.css is a copy of the dashboard's and is
       kept identical, so anything specific to this app lives here.
       The shared sheet sizes every inline icon to 16px, which is right in a
       button and far too small for the icon of an empty page or a customer's
       header — hence the explicit sizes. */
    .empty .big svg { width: 40px; height: 40px; }
    .org-head { display: flex; align-items: center; gap: 14px; }
    .org-head .mark { width: 46px; height: 46px; border-radius: var(--r-md); display: grid;
                      place-items: center; font-weight: 700; font-size: 16px; color: #fff; flex: none; }
    .org-head h3 { margin: 0; font-size: 17px; font-weight: 650; }
    .org-head small { color: var(--text-faint); font-size: 12.5px; }
    .nav button .back-ico { display: inline-flex; transform: rotate(180deg); }

    /* ---- forms ---- */
    .frow { margin-bottom: 15px; }
    .frow > label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; font-weight: 500; }
    .frow .inp, .frow select.inp, .frow textarea.inp { width: 100%; }
    .hint { font-size: 11.5px; color: var(--text-faint); margin-top: 5px; line-height: 1.5; }
    .form-block { margin-bottom: 14px; }
    .form-body { padding: 16px 18px 4px; }
    .form-foot { display: flex; justify-content: flex-end; gap: 9px; margin: 4px 0 20px; }
    .boolrow { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .boolrow input { width: 16px; height: 16px; accent-color: var(--accent); }
    /* A value the RMM owns is shown, not offered: an input you cannot use still
       looks like one you forgot to fill in. */
    .rmm-val { display: flex; align-items: center; gap: 9px; font-size: 13px;
               padding: 9px 12px; background: var(--surface-2); border: 1px dashed var(--border);
               border-radius: var(--r-sm); color: var(--text); }

    /* ---- small pills ---- */
    .tag { display: inline-flex; align-items: center; font-size: 10.5px; font-weight: 600;
           text-transform: uppercase; letter-spacing: .04em; padding: 2px 7px; border-radius: 99px;
           background: var(--surface-3); color: var(--text-faint); border: 1px solid var(--border); }
    .tag.warn { background: color-mix(in srgb, var(--warn) 16%, transparent);
                color: var(--warn); border-color: transparent; }

    /* ---- filter chips above a list ---- */
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .chip { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px;
            background: var(--surface-2); border: 1px solid var(--border); border-radius: 99px;
            color: var(--text-dim); font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; }
    .chip:hover { border-color: var(--border-strong); color: var(--text); }
    .chip.on { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
    .chip svg { width: 14px; height: 14px; }
    .chip .n { font-weight: 700; opacity: .65; }
    .kind-cell { display: inline-flex; align-items: center; gap: 7px; color: var(--text-dim); }
    .kind-cell svg { width: 14px; height: 14px; }
    td.right { text-align: right; }

    /* ---- one item ---- */
    .item-head { display: flex; align-items: center; gap: 14px; padding: 18px 20px; margin-bottom: 14px; }
    .ih-mark { width: 42px; height: 42px; border-radius: var(--r-md); flex: none; display: grid;
               place-items: center; background: var(--surface-3); color: var(--text-dim); }
    .ih-mark svg { width: 20px; height: 20px; }
    .ih-txt { flex: 1; min-width: 0; }
    .ih-txt h3 { margin: 0 0 3px; font-size: 17px; font-weight: 650; }
    .ih-txt small { color: var(--text-faint); font-size: 12px; display: flex; align-items: center;
                    gap: 8px; flex-wrap: wrap; }
    .ih-act { display: flex; gap: 8px; flex: none; }

    .deflist { display: grid; grid-template-columns: 210px 1fr; }
    .deflist .dt, .deflist .dd { padding: 11px 18px; border-bottom: 1px solid var(--border-soft);
                                 font-size: 13px; }
    .deflist .dt { color: var(--text-dim); display: flex; align-items: center; gap: 8px; }
    .deflist .dd { white-space: pre-wrap; }
    .deflist .dd a { color: var(--accent); cursor: pointer; }
    .deflist > :nth-last-child(-n+2) { border-bottom: 0; }
    @media (max-width: 720px) { .deflist { grid-template-columns: 1fr; }
      .deflist .dt { padding-bottom: 0; border-bottom: 0; } }

    /* ---- related ---- */
    .rel-row { display: flex; align-items: center; gap: 11px; padding: 11px 18px;
               border-bottom: 1px solid var(--border-soft); cursor: pointer; font-size: 13px; }
    .rel-row:hover { background: var(--surface-hover); }
    .rel-ic { color: var(--text-faint); display: inline-flex; }
    .rel-name { font-weight: 550; }
    .rel-row small { color: var(--text-faint); margin-left: auto; }
    .rel-add { display: flex; gap: 9px; padding: 14px 18px; border-top: 1px solid var(--border-soft); }
    .rel-add .inp { flex: 1; }

    /* ---- history ---- */
    .rev-row { padding: 13px 18px; border-bottom: 1px solid var(--border-soft); }
    .rev-row:last-child { border-bottom: 0; }
    .rev-top { display: flex; align-items: center; gap: 10px; font-size: 12.5px; }
    .rev-top .btn { margin-left: auto; }
    .rev-change { display: flex; align-items: baseline; gap: 9px; margin-top: 7px; font-size: 12.5px;
                  flex-wrap: wrap; }
    .rc-field { color: var(--text-dim); min-width: 150px; }
    .rc-from { color: var(--text-faint); text-decoration: line-through; }
    .rc-arrow { color: var(--text-faint); }
    .rc-to { font-weight: 550; }

    /* ---- what runs out soon ---- */
    .due-list { margin-top: 8px; display: grid; gap: 5px; }
    .due-row { display: flex; align-items: center; gap: 10px; cursor: pointer;
               padding: 4px 0; font-size: 12.5px; }
    .due-row:hover .due-name { text-decoration: underline; }
    .due-name { font-weight: 600; min-width: 160px; }
    .due-row .muted:last-child { margin-left: auto; }

    /* ---- network adapters ---- */
    .ad-row { display: grid; grid-template-columns: 1fr auto auto; align-items: center;
              gap: 12px; padding: 11px 18px; border-bottom: 1px solid var(--border-soft);
              font-size: 13px; }
    .ad-main { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
    .ad-name { font-weight: 600; }
    .ad-mac { color: var(--text-faint); font-size: 12px; }
    .ad-port { display: flex; align-items: center; gap: 8px; }
    .ad-port a { color: var(--accent); cursor: pointer; }
    .port-no { color: var(--text-dim); }
    .ad-act { display: flex; gap: 6px; }
    .ad-form, #ad-new { grid-column: 1 / -1; }
    .plug-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
                padding: 12px 0 2px; }
    .panel-head .spacer { flex: 1; }

    /* ---- a switch's patch list ---- */
    table.grid.ports td { padding: 8px 18px; }
    table.grid.ports tbody tr { cursor: default; }
    table.grid.ports tbody tr.free td { color: var(--text-faint); }
    table.grid.ports .pnum { font-weight: 700; width: 90px; }
    table.grid.ports a { color: var(--accent); cursor: pointer; }

    /* ---- what points at this ---- */
    .backref-group { border-bottom: 1px solid var(--border-soft); }
    .backref-group:last-child { border-bottom: 0; }
    .backref-label { padding: 10px 18px 2px; font-size: 11px; font-weight: 600;
                     letter-spacing: .05em; text-transform: uppercase; color: var(--text-faint); }
    .backref-group .rel-row:last-child { border-bottom: 0; }

    /* ---- the vault ---- */
    .secret-row { display: flex; align-items: center; gap: 9px; padding: 14px 18px; flex-wrap: wrap; }
    .secret-val { font-size: 15px; letter-spacing: .06em; padding: 7px 12px; border-radius: var(--r-sm);
                  background: var(--surface-2); border: 1px solid var(--border); flex: 1;
                  min-width: 200px; word-break: break-all; }
    .secret-note { padding: 0 18px 14px; font-size: 11.5px; color: var(--text-faint); }
    .cb-pad { padding: 0 18px 14px; }
    .cb-pad .plug-row { padding-top: 0; }

    /* ---- a document's text ---- */
    .longtext { padding: 16px 18px; font-size: 13.5px; line-height: 1.7; white-space: pre-wrap;
                word-break: break-word; }
    .longtext-input { font-size: 13.5px; line-height: 1.7; resize: vertical; }

    /* ---- search ---- */
    .hit { display: block; padding: 13px 18px; border-bottom: 1px solid var(--border-soft);
           cursor: pointer; }
    .hit:last-child { border-bottom: 0; }
    .hit:hover { background: var(--surface-hover); }
    .hit-top { display: flex; align-items: center; gap: 10px; font-size: 13.5px; }
    .hit-top svg { width: 15px; height: 15px; color: var(--text-faint); }
    .hit-name { font-weight: 600; }
    .hit-org { margin-left: auto; color: var(--text-faint); font-size: 12px; }
    .hit-why { margin-top: 5px; font-size: 12px; color: var(--text-dim); display: flex;
               gap: 8px; flex-wrap: wrap; }
    .hit-why b { color: var(--text-faint); font-weight: 600; }
    .hit-why mark { background: color-mix(in srgb, var(--accent) 30%, transparent);
                    color: inherit; border-radius: 3px; padding: 0 2px; }
    @media (max-width: 900px) { .searchbox { display: none; } }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="logo" id="brand-logo"></span> Leuffen <span>Doc</span></div>
      <nav class="crumbs"><a id="crumb-home">Klanten</a><span class="sep hidden" id="crumb-sep">/</span>
        <a class="here hidden" id="crumb-org"></a></nav>
      <div class="spacer"></div>
      <div class="searchbox" id="searchbox"><span id="search-ico"></span>
        <input id="search-input" placeholder="Zoek op naam, serienummer, IP of MAC…" />
        <kbd>Ctrl K</kbd></div>
      <button class="icon-btn" id="theme-btn" title="Thema wisselen"></button>
      <div class="userchip" id="userchip"><span class="avatar" id="avatar"></span>
        <span class="who"><span id="user-name"></span><small id="user-email"></small></span></div>
      <a class="icon-btn" id="logout-btn" href="/auth/logout" title="Afmelden"></a>
    </header>

    <main>
      <section>
        <div class="org-layout">
          <aside class="sidebar">
            <div class="side-label" id="nav-label">Overzicht</div>
            <div class="nav" id="nav"></div>
          </aside>

          <div class="content">
            <div class="page-head">
              <div><h1 id="page-title">Klanten</h1><p id="page-sub">De klanten die je mag zien</p></div>
              <div style="display:flex;gap:8px" id="page-actions"></div>
            </div>
            <div id="view"></div>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="/icons.js"></script>
  <script src="/items.js"></script>
  <script src="/app.js"></script>
</body>
</html>
