<!DOCTYPE html>
<html lang="nl" data-theme="dark" data-density="1">
<head>
  <meta charset="utf-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LeuffenDoc</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    /* A few rules of our own. styles.css is a copy of the dashboard's and is
       kept identical, so anything specific to this app lives here.
       The shared sheet sizes every inline icon to 16px, which is right in a
       button and far too small for the icon of an empty page or a customer's
       header — hence the explicit sizes. */
    .empty .big svg { width: 40px; height: 40px; }
    .org-head { display: flex; align-items: center; gap: 14px; }
    .org-head .mark { width: 46px; height: 46px; border-radius: var(--r-md); display: grid;
                      place-items: center; font-weight: 700; font-size: 16px; color: #fff; flex: none; }
    .org-head h3 { margin: 0; font-size: 17px; font-weight: 650; }
    .org-head small { color: var(--text-faint); font-size: 12.5px; }
    .nav button .back-ico { display: inline-flex; transform: rotate(180deg); }

    /* ---- forms ---- */
    .frow { margin-bottom: 15px; }
    .frow > label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; font-weight: 500; }
    .frow .inp, .frow select.inp, .frow textarea.inp { width: 100%; }
    .hint { font-size: 11.5px; color: var(--text-faint); margin-top: 5px; line-height: 1.5; }
    .form-block { margin-bottom: 14px; }
    .form-body { padding: 16px 18px 4px; }
    .form-foot { display: flex; justify-content: flex-end; gap: 9px; margin: 4px 0 20px; }
    .boolrow { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .boolrow input { width: 16px; height: 16px; accent-color: var(--accent); }
    /* A value the RMM owns is shown, not offered: an input you cannot use still
       looks like one you forgot to fill in. */
    .rmm-val { display: flex; align-items: center; gap: 9px; font-size: 13px;
               padding: 9px 12px; background: var(--surface-2); border: 1px dashed var(--border);
               border-radius: var(--r-sm); color: var(--text); }

    /* ---- small pills ---- */
    .tag { display: inline-flex; align-items: center; font-size: 10.5px; font-weight: 600;
           text-transform: uppercase; letter-spacing: .04em; padding: 2px 7px; border-radius: 99px;
           background: var(--surface-3); color: var(--text-faint); border: 1px solid var(--border); }
    .tag.warn { background: color-mix(in srgb, var(--warn) 16%, transparent);
                color: var(--warn); border-color: transparent; }

    /* ---- filter chips above a list ---- */
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .chip { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px;
            background: var(--surface-2); border: 1px solid var(--border); border-radius: 99px;
            color: var(--text-dim); font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; }
    .chip:hover { border-color: var(--border-strong); color: var(--text); }
    .chip.on { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
    .chip svg { width: 14px; height: 14px; }
    .chip .n { font-weight: 700; opacity: .65; }
    .kind-cell { display: inline-flex; align-items: center; gap: 7px; color: var(--text-dim); }
    .kind-cell svg { width: 14px; height: 14px; }
    td.right { text-align: right; }

    /* ---- one item ---- */
    .item-head { display: flex; align-items: center; gap: 14px; padding: 18px 20px; margin-bottom: 14px; }
    .ih-mark { width: 42px; height: 42px; border-radius: var(--r-md); flex: none; display: grid;
               place-items: center; background: var(--surface-3); color: var(--text-dim); }
    .ih-mark svg { width: 20px; height: 20px; }
    .ih-txt { flex: 1; min-width: 0; }
    .ih-txt h3 { margin: 0 0 3px; font-size: 17px; font-weight: 650; }
    .ih-txt small { color: var(--text-faint); font-size: 12px; display: flex; align-items: center;
                    gap: 8px; flex-wrap: wrap; }
    .ih-act { display: flex; gap: 8px; flex: none; }

    .deflist { display: grid; grid-template-columns: 210px 1fr; }
    .deflist .dt, .deflist .dd { padding: 11px 18px; border-bottom: 1px solid var(--border-soft);
                                 font-size: 13px; }
    .deflist .dt { color: var(--text-dim); display: flex; align-items: center; gap: 8px; }
    .deflist .dd { white-space: pre-wrap; min-width: 0; overflow-wrap: anywhere; }
    /* In a half block the names get a share of the width rather than a fixed
       210 pixels, and wrap instead of running into the value. */
    .blocks .panel.half .deflist { grid-template-columns: minmax(0, 44%) minmax(0, 1fr); }
    .deflist .dt { flex-wrap: wrap; min-width: 0; }
    .deflist .dd a { color: var(--accent); cursor: pointer; }
    .deflist > :nth-last-child(-n+2) { border-bottom: 0; }
    @media (max-width: 720px) { .deflist { grid-template-columns: 1fr; }
      .deflist .dt { padding-bottom: 0; border-bottom: 0; } }

    /* The blocks of a page, laid out under Documenttypes: full width, or half --
       two half blocks side by side. On a narrow screen every block is full. */
    .blocks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px;
              margin-bottom: 14px; align-items: start; }
    .blocks > .panel { grid-column: 1 / -1; margin: 0; }
    .blocks > .panel.half { grid-column: auto; }
    .blocks > .panel.half .deflist { grid-template-columns: minmax(110px, 40%) 1fr; }
    @media (max-width: 900px) { .blocks > .panel.half { grid-column: 1 / -1; } }
    /* Above a list: the filter chips on the left, the archive on the right. */
    .list-bar { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
    .list-search { width: 260px; flex: none; height: 32px; }
    @media (max-width: 720px) { .list-search { width: 100%; } }
    a.link { color: var(--accent); cursor: pointer; }
    .list-bar .chips { flex: 1; margin-bottom: 0; }
    .list-bar > .btn { margin-left: auto; flex: none; }
    .list-bar > .btn .count { margin-left: 2px; font-weight: 700; opacity: .7; }
    /* ---- photos and files on an item ---- */
    .files-panel.dragover { outline: 2px dashed var(--accent); outline-offset: -2px; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px;
               padding: 12px 14px; }
    .thumb { padding: 0; border: 1px solid var(--border); border-radius: var(--r-sm); overflow: hidden;
             background: var(--surface-2); cursor: zoom-in; aspect-ratio: 4 / 3; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumb:hover { border-color: var(--accent); }
    .file-list { padding: 4px 0; }
    .file-row { display: flex; align-items: center; gap: 10px; padding: 7px 14px 7px 18px;
                border-top: 1px solid var(--border-soft); font-size: 13px; }
    .fr-ic { display: inline-flex; color: var(--text-faint); }
    .fr-ic svg { width: 15px; height: 15px; }
    .fr-name { color: var(--accent); font-weight: 550; min-width: 0; overflow: hidden; text-overflow: ellipsis;
               white-space: nowrap; text-decoration: none; }
    .fr-meta { color: var(--text-faint); font-size: 12px; margin-left: auto; white-space: nowrap; }
    .files-hint { display: flex; align-items: center; gap: 10px; width: calc(100% - 28px); margin: 10px 14px 14px;
                  padding: 11px 14px; border: 1.5px dashed var(--border); border-radius: var(--r-md);
                  background: transparent; font: inherit; font-size: 12.5px; line-height: 1.45;
                  color: var(--text-faint); text-align: left; cursor: pointer; }
    .files-hint:hover, .files-panel.dragover .files-hint { border-color: var(--accent); color: var(--text-dim); }
    .files-hint svg { width: 18px; height: 18px; flex: none; }
    .files-busy { padding: 0 18px 12px; font-size: 12.5px; color: var(--accent); }
    .viewer { position: fixed; inset: 0; z-index: 200; background: rgba(5, 8, 14, .92);
              display: flex; flex-direction: column; }
    .vw-bar { display: flex; align-items: center; gap: 10px; padding: 12px 18px; color: #e8ecf3; }
    .vw-name { font-weight: 600; }
    .vw-meta { color: #9aa3b5; font-size: 12.5px; }
    .vw-stage { flex: 1; display: flex; align-items: center; justify-content: center; gap: 14px;
                padding: 0 18px 18px; min-height: 0; }
    .vw-stage img { max-width: calc(100% - 120px); max-height: 100%; object-fit: contain; border-radius: 6px; }
    .vw-nav { width: 44px; height: 44px; border-radius: 50%; border: 0; cursor: pointer; flex: none;
              background: rgba(255, 255, 255, .12); color: #fff; display: grid; place-items: center; }
    .vw-nav:hover { background: rgba(255, 255, 255, .22); }
    .vw-nav svg { width: 20px; height: 20px; }
    .vw-nav.prev svg { transform: rotate(180deg); }
    /* ---- a patch cabinet, as it stands (rack.js) ----
       Cabinets are black metal in either theme, so their colours are fixed. */
    .rk-wrap { display: flex; gap: 22px; align-items: flex-start; padding: 18px; flex-wrap: wrap; }
    .rk-cabinet { flex: none; }
    .rk-top { height: 14px; background: linear-gradient(#3a3f48, #24272d); border-radius: 6px 6px 0 0;
              border: 1px solid #111; }
    .rk-frame { display: flex; background: #15171b; border: 1px solid #0b0c0e; border-top: 0; border-bottom: 0;
                padding: 4px 0; }
    .rk-rail { position: relative; width: 26px; background: repeating-linear-gradient(#2c3037 0 1px, #1f2227 1px 40px); }
    .rk-rail span { position: absolute; left: 0; right: 0; height: 40px; display: grid; place-items: center;
                    font: 600 10px/1 var(--font-mono, monospace); color: #6d7584; }
    .rk-bay { position: relative; background: repeating-linear-gradient(#101215 0 39px, #1b1e23 39px 40px); }
    .rk-feet { display: flex; justify-content: space-between; padding: 0 10px; }
    .rk-feet i { width: 34px; height: 8px; background: #2a2e35; border-radius: 0 0 4px 4px; }
    .rk-slot { position: absolute; left: -26px; right: -26px; display: flex; cursor: pointer; z-index: 1; }
    .rk-slot:hover { filter: brightness(1.12); }
    .rk-slot.sel { outline: 2px solid var(--accent); outline-offset: 1px; z-index: 2; }
    .rk-ear { width: 26px; flex: none; background: linear-gradient(90deg, #8b9099, #b4b9c1 50%, #8b9099);
              display: flex; flex-direction: column; justify-content: space-around; align-items: center;
              border-top: 1px solid #c9cdd3; border-bottom: 1px solid #5d626b; }
    .rk-ear i { width: 8px; height: 8px; border-radius: 50%; background: #3a3e45; box-shadow: inset 0 1px 1px #000; }
    .rk-ear.l { order: 0; } .rk-ear.r { order: 2; }
    .rk-body, .rk-plate { order: 1; flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 3px 8px;
                          color: #dfe3ea; border-top: 1px solid #4a505a; border-bottom: 1px solid #0c0d10;
                          background: linear-gradient(#3a3f47, #2b2f36); overflow: hidden; }
    .rk-name { font: 600 11px/1.15 var(--font, sans-serif); white-space: nowrap; overflow: hidden;
               text-overflow: ellipsis; max-width: 110px; flex: none; }
    .rk-role { font-size: 9.5px; color: #98a0ad; flex: none; }
    .rk-leds { display: flex; gap: 3px; flex: none; }
    .rk-leds i { width: 5px; height: 5px; border-radius: 50%; background: #3f6d3f; }
    .rk-leds i.pwr { background: #44d16a; box-shadow: 0 0 5px #44d16a; }
    .rk-ports { flex: 1; display: grid; gap: 2px; margin-left: auto; max-width: 300px; height: calc(100% - 4px); }
    .rk-port { background: #0d0f12; border: 1px solid #50565f; border-radius: 1px; min-height: 0; position: relative; }
    .rk-port::after { content: ""; position: absolute; left: 30%; right: 30%; bottom: 0; height: 30%; background: #2a2e34; }
    .rk-port.on { border-color: #36c262; box-shadow: inset 0 0 0 1px #1d6b35, 0 0 4px rgba(54, 194, 98, .55); }
    .rk-port.on::after { background: #36c262; }
    .rk-port.jack { border-radius: 2px; background: #0a0b0d; border-color: #3d424a; }
    .rk-body.rk-sw { background: linear-gradient(#2f4058, #22324a); }
    .rk-body.rk-patch { background: linear-gradient(#202227, #16181b); }
    .rk-body.rk-srv { background: linear-gradient(#3c4149, #2c3037); }
    .rk-bays { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; height: calc(100% - 6px);
               max-width: 220px; margin-left: auto; }
    .rk-bays.h1 { grid-template-columns: repeat(8, 1fr); }
    .rk-bays i { background: linear-gradient(#24272c, #1a1c20); border: 1px solid #555b64; border-radius: 1px; }
    .rk-body.rk-app { background: linear-gradient(#4a3236, #36252a); }
    .rk-body.rk-pdu { background: linear-gradient(#26292e, #1c1e22); }
    .rk-sockets { flex: 1; display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; max-width: 260px;
                  margin-left: auto; height: 70%; }
    .rk-sockets i { background: #0c0d10; border: 1px solid #4b5059; border-radius: 3px; }
    .rk-body.rk-ups { background: linear-gradient(#2a2d33, #1d1f23); }
    .rk-lcd { margin-left: auto; padding: 2px 7px; background: #1d3a4a; color: #8fd3ff; font: 600 9px/1.2 monospace;
              border: 1px solid #0d1c25; border-radius: 2px; }
    .rk-plate { background: linear-gradient(#262a30, #1d2025); justify-content: center; }
    .rk-plate.rk-blank { background: repeating-linear-gradient(90deg, #22252a 0 6px, #1e2125 6px 12px); }
    .rk-plate.rk-cable { gap: 14px; background: #17191d; }
    .rk-plate.rk-cable i { width: 22px; height: 70%; border: 3px solid #3d424b; border-bottom: 0; border-radius: 10px 10px 0 0; }
    .rk-plate.rk-shelf { align-items: flex-end; background: linear-gradient(transparent 70%, #4b5059 70%, #33373e); }
    .rk-plate.rk-gone { background: repeating-linear-gradient(45deg, #2c2224 0 8px, #241c1e 8px 16px); }
    .rk-drop { position: absolute; left: -26px; right: -26px; border: 2px dashed #36c262; background: rgba(54, 194, 98, .15);
               z-index: 3; pointer-events: none; }
    .rk-drop.bad { border-color: #e5484d; background: rgba(229, 72, 77, .15); }
    .rk-side { flex: 1; min-width: 260px; max-width: 420px; display: flex; flex-direction: column; gap: 14px; }
    .rk-side-sec h3 { margin: 0 0 8px; font-size: 12px; color: var(--text-dim); text-transform: uppercase;
                      letter-spacing: .05em; }
    .rk-side-sec .inp { margin-bottom: 8px; height: 32px; }
    .rk-picks { display: flex; flex-direction: column; gap: 5px; max-height: 440px; overflow: auto; }
    .rk-find { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .rk-find .inp { margin: 0; flex: 1; min-width: 0; }
    .rk-sort { display: inline-flex; border: 1px solid var(--border); border-radius: var(--r-sm); overflow: hidden; flex: none; }
    .rk-sort button { border: 0; background: transparent; color: var(--text-dim); font: inherit; font-size: 12px;
                      padding: 0 10px; height: 30px; cursor: pointer; }
    .rk-sort button + button { border-left: 1px solid var(--border); }
    .rk-sort button.on { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--text); font-weight: 600; }
    .rk-group { display: flex; flex-direction: column; gap: 5px; }
    .rk-group + .rk-group { margin-top: 6px; }
    /* Stays in view while its type scrolls past. */
    .rk-group-head { display: flex; align-items: center; gap: 7px; padding: 3px 2px 2px; font-size: 11.5px;
                     font-weight: 600; color: var(--text-dim); position: sticky; top: 0; z-index: 1;
                     background: var(--surface); }
    .rk-group-head .rk-pick-ic svg { width: 13px; height: 13px; }
    .rk-group-head .n { margin-left: auto; color: var(--text-faint); font-weight: 500; }
    .rk-pick { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border: 1px solid var(--border);
               border-radius: var(--r-sm); background: var(--surface-2); cursor: grab; font-size: 13px; }
    .rk-pick:hover { border-color: var(--accent); }
    .rk-pick .muted { margin-left: auto; font-size: 11.5px; white-space: nowrap; }
    .rk-pick-ic { display: inline-flex; color: var(--text-dim); }
    .rk-pick-ic svg { width: 15px; height: 15px; }
    .rk-pick-name { font-weight: 550; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rk-mini { width: 30px; height: 10px; border-radius: 2px; background: #2b2f36; border: 1px solid #50565f; flex: none; }
    .rk-mini.rk-patch { background: repeating-linear-gradient(90deg, #0d0f12 0 3px, #50565f 3px 4px); }
    .rk-mini.rk-ups { height: 16px; } .rk-mini.rk-shelf { height: 16px; border-top-color: transparent; }
    .rk-none { padding: 8px 2px; font-size: 12.5px; }
    .rk-help { font-size: 12.5px; color: var(--text-faint); line-height: 1.5; }
    .rk-insp { border: 1px solid var(--accent); border-radius: var(--r-md); padding: 12px 12px 4px; }
    .rk-insp-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
    .rk-insp-head .muted { margin-left: auto; font-family: var(--font-mono, monospace); font-size: 12px; }
    .rk-insp-acts { display: flex; gap: 6px; flex-wrap: wrap; padding-bottom: 8px; }
    .rk-where { margin-left: 8px; cursor: pointer; gap: 4px; text-transform: none; letter-spacing: 0; }
    .rk-where svg { width: 11px; height: 11px; }
    #rack-view > * { margin-bottom: 14px; }
    /* What stands: on a shelf (with its brackets) or on the bottom of the cabinet. */
    .rk-holder { order: 1; flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; }
    .rk-floor { background: linear-gradient(transparent, rgba(0, 0, 0, .3)); }
    .rk-things { flex: 1; display: flex; align-items: flex-end; gap: 6px; padding: 0 10px; min-height: 0; overflow: hidden; }
    .rk-plank { height: 8px; flex: none; position: relative; background: linear-gradient(#5b616b, #3a3f47);
                border-top: 1px solid #8a909a; }
    .rk-floor .rk-plank { height: 10px; background: linear-gradient(#2e3238, #1c1f23); border-top-color: #4a5058; }
    .rk-plank-name { position: absolute; right: 8px; top: -1px; font-size: 8px; line-height: 10px; color: #c9ced6;
                     letter-spacing: .04em; text-transform: uppercase; }
    .rk-holder-empty { margin: auto; padding-bottom: 4px; font-size: 11px; color: #7d8594; }
    .rk-slot.drop-on { outline: 2px dashed #36c262; outline-offset: -2px; }
    .rk-thing { flex: 0 1 auto; position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px;
                padding: 4px 3px 3px; border-radius: 3px 3px 1px 1px; border: 1px solid #555b65; cursor: pointer;
                overflow: hidden; background: linear-gradient(#3b4048, #2a2e35); min-width: 34px; }
    .rk-thing:hover { filter: brightness(1.15); }
    .rk-thing.sel { outline: 2px solid var(--accent); outline-offset: 1px; z-index: 2; }
    .rk-thing-name { font: 600 9.5px/1.1 var(--font, sans-serif); color: #e4e8ef; text-align: center; max-width: 100%;
                     overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rk-thing .rk-leds { margin-top: auto; }
    .rk-thing .rk-lcd { margin: 2px 0 0; }
    .rk-st-modem, .rk-st-printer { background: linear-gradient(#f2f3f5, #d6d9de); border-color: #a9afb8; }
    .rk-st-modem .rk-thing-name, .rk-st-printer .rk-thing-name { color: #22262d; }
    .rk-st-ups { background: linear-gradient(#2a2d33, #17191c); }
    .rk-st-nas { background: linear-gradient(#2c3036, #1f2226); }
    .rk-st-tower { background: linear-gradient(#3a3f47, #25282e); }
    .rk-st-net { background: linear-gradient(#2f4058, #22324a); }
    .rk-st-bays { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2px; width: 82%; flex: 1; min-height: 0; }
    .rk-st-bays i { background: #121417; border: 1px solid #50565f; border-radius: 1px; }
    .rk-st-ports { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; width: 92%; height: 7px; }
    .rk-st-ports i { background: #0d0f12; border: 1px solid #50565f; }
    .rk-mini.rk-floor { height: 6px; background: #2e3238; }
    .rk-mini.rk-ups_box { width: 14px; height: 18px; }
    .rk-mini.rk-box { width: 22px; height: 12px; background: #d6d9de; }
    /* Scrolled to (a copy being made): clear of the bar that stays at the top. */
    #new-item { scroll-margin-top: 84px; }
    /* The sections under an item's blocks, spaced like the blocks themselves. */
    #files > *, #secret > *, #access > *, #adapters > *, #ports > *, #passwords > *,
    #referred > *, #related > *, #history > *, #unifi { margin-bottom: 14px; }

    /* ---- an item's page: what it is on the left, what hangs off it on the right ---- */
    .item-cols { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 0 14px; align-items: start; }
    .item-cols.solo { grid-template-columns: minmax(0, 1fr); }
    .item-main, .item-side { min-width: 0; }
    .rev-more { display: block; width: 100%; padding: 10px; border: 0; background: transparent;
                color: var(--accent); font: inherit; font-size: 12.5px; font-weight: 550; cursor: pointer; }
    .rev-more:hover { background: var(--surface-hover); }
    @media (max-width: 1280px) {
      .item-cols { grid-template-columns: minmax(0, 1fr); }
    }
    /* Beside the page, the panels are a column of their own: tighter, and
       what does not fit on a line goes underneath rather than off the edge. */
    @media (min-width: 1281px) {
      .item-cols:not(.solo) .item-side .panel-head { padding: 12px 14px; flex-wrap: wrap; gap: 6px 10px; }
      .item-cols:not(.solo) .item-side .rel-row { padding: 9px 14px; gap: 9px; }
      .item-cols:not(.solo) .item-side .rel-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .item-cols:not(.solo) .item-side .rel-add { padding: 12px 14px; }
      .item-cols:not(.solo) .item-side .rel-add .inp { min-width: 0; }
      .item-cols:not(.solo) .item-side .backref-label { padding: 10px 14px 2px; }
      .item-cols:not(.solo) .item-side .gallery { grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 12px 14px 0; }
      .item-cols:not(.solo) .item-side .file-row { flex-wrap: wrap; padding: 7px 10px 7px 14px; row-gap: 0; }
      .item-cols:not(.solo) .item-side .fr-name { flex: 1; }
      .item-cols:not(.solo) .item-side .fr-meta { order: 5; flex-basis: 100%; margin: 0 0 0 25px; font-size: 11.5px; }
      .item-cols:not(.solo) .item-side .rev-row { padding: 11px 14px; }
      .item-cols:not(.solo) .item-side .rev-top { flex-wrap: wrap; gap: 2px 8px; }
      .item-cols:not(.solo) .item-side .rev-top b { flex-basis: 100%; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
      .item-cols:not(.solo) .item-side .rev-change { margin-top: 5px; gap: 2px 7px; }
      .item-cols:not(.solo) .item-side .rc-field { min-width: 0; flex-basis: 100%; font-size: 11.5px; }
    }

    /* ---- related ---- */
    .rel-row { display: flex; align-items: center; gap: 11px; padding: 11px 18px;
               border-bottom: 1px solid var(--border-soft); cursor: pointer; font-size: 13px; }
    .rel-row:hover { background: var(--surface-hover); }
    .rel-ic { color: var(--text-faint); display: inline-flex; }
    .rel-name { font-weight: 550; }
    .rel-row small { color: var(--text-faint); margin-left: auto; }
    .rel-add { display: flex; gap: 9px; padding: 14px 18px; border-top: 1px solid var(--border-soft); }
    .rel-add .inp { flex: 1; }
    /* Linking by searching: the matches open under the field, inside the panel. */
    .rel-find { flex: 1; min-width: 0; }
    .rel-field { position: relative; display: block; }
    .rel-find-ic { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); display: inline-flex;
                   color: var(--text-faint); pointer-events: none; }
    .rel-find-ic svg { width: 15px; height: 15px; }
    .rel-field .inp { width: 100%; padding-left: 32px; }
    .rel-hits { margin-top: 6px; border: 1px solid var(--border); border-radius: var(--r-sm); overflow: hidden;
                background: var(--surface-2); }
    .rel-hit { display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 10px; border: 0;
               background: transparent; color: inherit; font: inherit; font-size: 13px; text-align: left; cursor: pointer; }
    .rel-hit + .rel-hit { border-top: 1px solid var(--border-soft); }
    .rel-hit.on, .rel-hit:hover { background: color-mix(in srgb, var(--accent) 14%, transparent); }
    .rel-hit .rel-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rel-hit small { margin-left: auto; color: var(--text-faint); white-space: nowrap; }
    .rel-more { padding: 8px 10px; font-size: 12px; color: var(--text-faint); border-top: 1px solid var(--border-soft); }
    .rel-hits > .rel-more:first-child { border-top: 0; }

    /* ---- history ---- */
    .rev-row { padding: 13px 18px; border-bottom: 1px solid var(--border-soft); }
    .rev-row:last-child { border-bottom: 0; }
    .rev-top { display: flex; align-items: center; gap: 10px; font-size: 12.5px; }
    .rev-top .btn { margin-left: auto; }
    .rev-change { display: flex; align-items: baseline; gap: 9px; margin-top: 7px; font-size: 12.5px;
                  flex-wrap: wrap; }
    .rc-field { color: var(--text-dim); min-width: 150px; }
    .rc-from { color: var(--text-faint); text-decoration: line-through; }
    .rc-arrow { color: var(--text-faint); }
    .rc-to { font-weight: 550; }
    .rc-said { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }

    /* ---- tables in a field: NAT, firewall rules ---- */
    .tview { padding: 4px 18px 14px; }
    .tview + .tview { border-top: 1px solid var(--border-soft); padding-top: 12px; }
    .tview-head { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--text-dim);
                  margin: 6px 0 8px; }
    .tview-head .n { font-size: 11px; color: var(--text-faint); background: var(--surface-2);
                     padding: 1px 7px; border-radius: 99px; }
    .tview-scroll { overflow-x: auto; }
    .tview-table, .tf-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    .tview-table th, .tf-table th { text-align: left; font-weight: 600; font-size: 11px; color: var(--text-faint);
                                    text-transform: uppercase; letter-spacing: .04em; padding: 6px 8px;
                                    border-bottom: 1px solid var(--border); white-space: nowrap; }
    .tview-table td { padding: 7px 8px; border-bottom: 1px solid var(--border-soft); white-space: nowrap; }
    .tview-table td:first-child { font-weight: 550; white-space: normal; }
    .tview-table tr:last-child td { border-bottom: 0; }
    .tf-table td { padding: 3px 4px 3px 0; }
    .tf-table td .inp { min-width: 90px; height: 32px; }
    .tf-table td:first-child .inp { min-width: 160px; }
    .tf-table td:last-child { width: 1%; }
    .tfield .tf-add { margin-top: 6px; }
    .tview.folded .tv-more { display: none; }

    /* ---- filling many switch ports at once ---- */
    .ports-bulk { margin: 12px 18px 4px; padding: 12px 14px 4px; border: 1px dashed var(--border);
                  border-radius: var(--r-md); background: var(--surface-2); }
    .pb-title { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600;
                color: var(--text-dim); margin-bottom: 8px; }
    .pb-title svg { width: 14px; height: 14px; color: var(--accent); }
    .pb-row { display: grid; grid-template-columns: minmax(120px, 1fr) minmax(160px, 2fr) minmax(80px, 110px) auto;
              gap: 0 10px; align-items: end; }
    .pb-row .btn { margin-bottom: 15px; }
    .pb-copy { grid-template-columns: minmax(200px, 1fr) auto; margin-top: 6px; }
    .ports-bulk .hint { margin: -6px 0 10px; }
    .ports-bulk code { font-size: 11.5px; background: var(--surface); padding: 0 4px; border-radius: 4px; }
    @keyframes pb-flash { from { background: color-mix(in srgb, var(--accent) 22%, transparent); } to { background: transparent; } }
    .port-edit.pb-filled td { animation: pb-flash 1.2s ease-out; }
    @media (max-width: 760px) { .pb-row, .pb-copy { grid-template-columns: 1fr; } }
    .tv-all { display: block; margin: 8px 0 0; padding: 6px 0; border: 0; background: transparent;
              color: var(--accent); font: inherit; font-size: 12.5px; font-weight: 550; cursor: pointer; }
    .tview-table a { color: var(--accent); }

    /* ---- Microsoft 365 ---- */
    #m365 > * { margin-bottom: 14px; }
    .m365-form { padding: 14px 18px 4px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
                 gap: 0 14px; align-items: end; }
    .m365-form .btn { margin-bottom: 15px; justify-self: start; }
    .m365-busy { font-size: 12.5px; color: var(--accent); margin-bottom: 15px; }
    .m365-how { padding: 0 18px 14px; font-size: 12.5px; color: var(--text-dim); }
    .m365-how summary { cursor: pointer; color: var(--accent); font-weight: 550; padding: 4px 0; }
    .m365-how ol, .m365-how ul { margin: 6px 0; padding-left: 20px; line-height: 1.6; }
    .m365-how code { font-size: 11.5px; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
    .m365-note { margin: 12px 18px; }
    .m365-note ul { margin: 6px 0 0; padding-left: 18px; }
    .m365-note .m365-how { padding: 6px 0 0; }
    .form-body .frow.wide { grid-column: 1 / -1; }

    /* ---- what runs out soon ---- */
    .due-list { margin-top: 8px; display: grid; gap: 5px; }
    .due-row { display: flex; align-items: center; gap: 10px; cursor: pointer;
               padding: 4px 0; font-size: 12.5px; }
    .due-row:hover .due-name { text-decoration: underline; }
    .due-name { font-weight: 600; min-width: 160px; }
    .due-row .muted:last-child { margin-left: auto; }

    /* ---- network adapters ---- */
    .ad-row { display: grid; grid-template-columns: 1fr auto auto; align-items: center;
              gap: 12px; padding: 11px 18px; border-bottom: 1px solid var(--border-soft);
              font-size: 13px; }
    .ad-main { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
    .ad-name { font-weight: 600; }
    .ad-mac { color: var(--text-faint); font-size: 12px; }
    .ad-port { display: flex; align-items: center; gap: 8px; }
    .ad-port a { color: var(--accent); cursor: pointer; }
    .port-no { color: var(--text-dim); }
    .ad-act { display: flex; gap: 6px; }
    .ad-form, #ad-new { grid-column: 1 / -1; }
    .plug-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
                padding: 12px 0 2px; }
    .panel-head .spacer { flex: 1; }

    /* ---- a switch's patch list ---- */
    table.grid.ports td { padding: 8px 18px; }
    table.grid.ports tbody tr { cursor: default; }
    table.grid.ports tbody tr.free td { color: var(--text-faint); }
    table.grid.ports .pnum { font-weight: 700; width: 90px; }
    table.grid.ports a { color: var(--accent); cursor: pointer; }

    /* ---- what points at this ---- */
    .backref-group { border-bottom: 1px solid var(--border-soft); }
    .backref-group:last-child { border-bottom: 0; }
    .backref-label { padding: 10px 18px 2px; font-size: 11px; font-weight: 600;
                     letter-spacing: .05em; text-transform: uppercase; color: var(--text-faint); }
    .backref-group .rel-row:last-child { border-bottom: 0; }

    /* ---- the vault ---- */
    .secret-row { display: flex; align-items: center; gap: 9px; padding: 14px 18px; flex-wrap: wrap; }
    .secret-val { font-size: 15px; letter-spacing: .06em; padding: 7px 12px; border-radius: var(--r-sm);
                  background: var(--surface-2); border: 1px solid var(--border); flex: 1;
                  min-width: 200px; word-break: break-all; }
    .secret-note { padding: 0 18px 14px; font-size: 11.5px; color: var(--text-faint); }
    .cb-pad { padding: 0 18px 14px; }
    .cb-pad .plug-row { padding-top: 0; }

    /* ---- a document's text ---- */
    .longtext { padding: 16px 18px; font-size: 13.5px; line-height: 1.7; white-space: pre-wrap;
                word-break: break-word; }
    .longtext-input { font-size: 13.5px; line-height: 1.7; resize: vertical; }

    /* ---- search ---- */
    .hit { display: block; padding: 13px 18px; border-bottom: 1px solid var(--border-soft);
           cursor: pointer; }
    .hit:last-child { border-bottom: 0; }
    .hit:hover { background: var(--surface-hover); }
    .hit-top { display: flex; align-items: center; gap: 10px; font-size: 13.5px; }
    .hit-top svg { width: 15px; height: 15px; color: var(--text-faint); }
    .hit-name { font-weight: 600; }
    .hit-org { margin-left: auto; color: var(--text-faint); font-size: 12px; }
    .hit-why { margin-top: 5px; font-size: 12px; color: var(--text-dim); display: flex;
               gap: 8px; flex-wrap: wrap; }
    .hit-why b { color: var(--text-faint); font-weight: 600; }
    .hit-why mark { background: color-mix(in srgb, var(--accent) 30%, transparent);
                    color: inherit; border-radius: 3px; padding: 0 2px; }
    @media (max-width: 900px) { .searchbox { display: none; } }

    /* ---- field icons ---- */
    .dt-ic, .lb-ic { display: inline-flex; color: var(--text-faint); flex: none; }
    .dt-ic svg, .lb-ic svg { width: 15px; height: 15px; }
    .lb-ic { margin-right: 6px; vertical-align: -3px; }
    .frow > label { display: flex; align-items: center; }

    /* ---- several values under one heading ---- */
    .lrows { display: grid; gap: 7px; margin-bottom: 8px; }
    .lrow { display: flex; gap: 7px; }
    .lrow .lf-label { max-width: 150px; }
    .lrow .inp { flex: 1; }
    .lline { display: flex; align-items: center; gap: 9px; padding: 1px 0; }

    /* ---- adapters inside the edit form ---- */
    .ad-edit { border: 1px solid var(--border); border-radius: var(--r-md); padding: 12px 14px 0;
               margin-bottom: 12px; background: var(--surface-2); }
    .ad-edit.removing { opacity: .5; }
    .ad-edit.removing .ad-edit-grid { text-decoration: line-through; }
    .ad-edit-head { display: flex; align-items: center; gap: 9px; font-size: 13px;
                    margin-bottom: 10px; }
    .ad-edit-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
                    gap: 0 14px; }
    .ad-edit-grid .ad-patch { grid-column: 1 / -1; }
    tr.port-edit.removing td { opacity: .5; text-decoration: line-through; }
    table.grid.ports .inp { padding: 5px 9px; font-size: 12.5px; }

    /* ---- a customer that is linked to the RMM ---- */
    .oc-mark, .org-head .mark { position: relative; overflow: visible; }
    .oc-rmm { position: absolute; right: -5px; bottom: -5px; width: 18px; height: 18px;
              border-radius: 99px; background: var(--accent); color: #fff; display: grid;
              place-items: center; border: 2px solid var(--surface); }
    .org-head .mark .oc-rmm { width: 21px; height: 21px; }
    .oc-rmm svg { width: 10px; height: 10px; }
    .org-head .mark .oc-rmm svg { width: 12px; height: 12px; }
    .oc-link { display: inline-flex; align-items: center; gap: 5px; }
    .oc-link svg { width: 12px; height: 12px; color: var(--accent); }

    /* ---- types you define yourself ---- */
    .type-card { display: flex; align-items: center; gap: 13px; padding: 13px 18px;
                 border-bottom: 1px solid var(--border-soft); }
    .type-card:last-child { border-bottom: 0; }
    .type-card.own { cursor: pointer; }
    .type-card.own:hover { background: var(--surface-hover); }
    .tc-ic { width: 34px; height: 34px; border-radius: var(--r-sm); flex: none; display: grid;
             place-items: center; background: var(--surface-3); color: var(--text-dim); }
    .tc-ic svg { width: 17px; height: 17px; }
    .tc-txt { flex: 1; min-width: 0; }
    .tc-txt h3 { margin: 0; font-size: 14px; font-weight: 600; }
    .tc-txt small { color: var(--text-faint); font-size: 12px; }
    .tc-meta { display: flex; align-items: center; gap: 9px; font-size: 12px; flex: none; }

    .tf-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
               gap: 0 14px; }
    .tf-row { border: 1px solid var(--border); border-radius: var(--r-md);
              padding: 12px 14px 2px; margin-bottom: 12px; background: var(--surface-2); }
    .tf-flags { display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
                padding: 0 0 12px; }
    .tf-flags .btn { margin-left: 0; }
    .tf-flags .tf-up { margin-left: auto; }
    .toggle-line { padding: 4px 0 14px; }
    .icon-pick { display: flex; flex-wrap: wrap; gap: 6px; }
    .ip { width: 34px; height: 34px; display: grid; place-items: center; cursor: pointer;
          background: var(--surface-2); border: 1px solid var(--border);
          border-radius: var(--r-sm); color: var(--text-dim); }
    .ip:hover { border-color: var(--border-strong); color: var(--text); }
    .ip.on { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
    .ip svg { width: 16px; height: 16px; }
    .tag.on { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

    /* ---- laying a type out: blocks, as they will sit on the page ---- */
    .lay-type-ic { display: inline-flex; color: var(--text-dim); }
    .lay-type-ic svg { width: 17px; height: 17px; }
    .lay-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;
                align-items: start; }
    .lay-block { grid-column: 1 / -1; border: 1px solid var(--border); border-radius: var(--r-md);
                 background: var(--surface-2); min-width: 0; }
    .lay-block.half { grid-column: auto; }
    @media (max-width: 900px) { .lay-block.half { grid-column: 1 / -1; } }
    .lay-head { display: flex; align-items: center; gap: 6px; padding: 8px 10px;
                border-bottom: 1px solid var(--border-soft); }
    .lay-title { flex: 1; min-width: 80px; font-weight: 600; height: 32px; }
    .lay-grip { display: inline-flex; color: var(--text-faint); cursor: grab; padding: 4px 2px; flex: none; }
    .lay-grip:active { cursor: grabbing; }
    .lay-grip svg { width: 15px; height: 15px; }
    .seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--r-sm); overflow: hidden; flex: none; }
    .seg-b { font: inherit; font-size: 12px; font-weight: 600; padding: 5px 9px; border: 0; cursor: pointer;
             background: transparent; color: var(--text-dim); }
    .seg-b + .seg-b { border-left: 1px solid var(--border); }
    .seg-b.on { background: var(--accent-soft); color: var(--accent); }
    .lay-ib { display: inline-grid; place-items: center; width: 28px; height: 28px; flex: none;
              border: 1px solid transparent; border-radius: var(--r-sm); background: transparent;
              color: var(--text-dim); cursor: pointer; }
    .lay-ib:hover:not(:disabled) { border-color: var(--border); color: var(--text); background: var(--surface); }
    .lay-ib.on { color: var(--accent); }
    .lay-ib:disabled { opacity: .35; cursor: default; }
    .lay-ib svg { width: 14px; height: 14px; }
    .lay-fields { padding: 8px; min-height: 46px; border-radius: var(--r-sm); }
    .lay-field { border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--surface);
                 margin-bottom: 6px; }
    .lay-field:last-child { margin-bottom: 0; }
    .lay-row { display: flex; align-items: center; gap: 8px; padding: 5px 6px 5px 8px; min-height: 38px; }
    .lay-name { font-size: 13px; font-weight: 550; min-width: 0; overflow: hidden; text-overflow: ellipsis;
                white-space: nowrap; }
    .lay-type { font-size: 11.5px; color: var(--text-faint); white-space: nowrap; }
    .lay-acts { margin-left: auto; display: inline-flex; gap: 2px; flex: none; }
    .lay-field.is-hidden .lay-name, .lay-field.is-hidden .lay-type { opacity: .55; }
    .lay-field.is-hidden .lay-name { text-decoration: line-through; }
    .lay-field.open { border-color: var(--accent); }
    .lay-edit { padding: 12px 12px 0; border-top: 1px solid var(--border-soft); }
    .lay-move { gap: 8px; color: var(--text-dim); font-size: 12.5px; }
    .lay-move select { width: auto; height: 30px; }
    .lay-empty { border: 1px dashed var(--border); border-radius: var(--r-sm); padding: 12px;
                 text-align: center; font-size: 12.5px; color: var(--text-faint); }
    .lay-add { display: flex; align-items: center; gap: 6px; width: 100%; padding: 8px 12px; font: inherit;
               font-size: 12.5px; font-weight: 600; color: var(--text-dim); background: transparent;
               border: 0; border-top: 1px solid var(--border-soft); cursor: pointer; }
    .lay-add:hover { color: var(--accent); }
    .lay-add svg { width: 14px; height: 14px; }
    .lay-foot { padding-top: 12px; }
    .lay-field.dragging, .lay-block.dragging { opacity: .4; }
    .lay-field.drop-before { box-shadow: 0 -3px 0 var(--accent); }
    .lay-field.drop-after { box-shadow: 0 3px 0 var(--accent); }
    .lay-fields.drop-into { outline: 2px dashed var(--accent); outline-offset: -2px; }
    .lay-block.drop-before { box-shadow: -4px 0 0 var(--accent); }
    .lay-block.drop-after { box-shadow: 4px 0 0 var(--accent); }
    .lay-block:not(.half).drop-before { box-shadow: 0 -4px 0 var(--accent); }
    .lay-block:not(.half).drop-after { box-shadow: 0 4px 0 var(--accent); }

    /* ---- Instellingen ---- */
    .blk-foot { display: flex; align-items: center; gap: 10px; padding: 12px 18px;
                border-top: 1px solid var(--border-soft); }
    .env-note { display: flex; align-items: center; gap: 6px; }
    .env-note svg { width: 12px; height: 12px; }
    .clear-row { margin-top: 7px; font-size: 12px; color: var(--text-dim); }
    .pw-classes { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
                  gap: 0 14px; }
    .pw-sample { display: flex; align-items: center; gap: 10px; }
    .pw-sample .mono { flex: 1; font-size: 15px; letter-spacing: .04em; padding: 8px 12px;
                       background: var(--surface-2); border: 1px solid var(--border);
                       border-radius: var(--r-sm); word-break: break-all; }
    .ver-pill { display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px;
                border-radius: var(--r-sm); background: var(--surface-2);
                border: 1px solid var(--border); font-size: 13px; }
    .ver-pill svg { width: 14px; height: 14px; color: var(--text-faint); }
    .upd-row { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
    .tag.ok { background: color-mix(in srgb, var(--good) 16%, transparent);
              color: var(--good); border-color: transparent; }
    .test-out { font-size: 12.5px; color: var(--text-dim); }
    .test-out.good { color: var(--good); }
    .test-out.bad { color: var(--bad); }
    input.inp:disabled { opacity: .55; cursor: not-allowed; }

    /* ---- who may see an item ---- */
    .acc-summary { padding: 13px 18px; font-size: 13px; color: var(--text-dim); line-height: 1.6; }
    .acc-summary b { color: var(--text); font-weight: 600; }
    .acc-list { border-top: 1px solid var(--border-soft); }
    .acc-row { display: flex; align-items: center; gap: 10px; padding: 9px 18px; font-size: 13px;
               border-bottom: 1px solid var(--border-soft); cursor: pointer; }
    .acc-row.fixed { cursor: default; opacity: .75; }
    .acc-row input { width: 16px; height: 16px; accent-color: var(--accent); }
    .acc-name { font-weight: 600; }
    .acc-foot { display: flex; align-items: center; gap: 8px; padding: 12px 18px; }
    .tag svg { width: 10px; height: 10px; margin-right: 3px; }

    /* ---- share links ---- */
    .share-form .plug-row label { font-size: 12px; }
    .share-made { border: 1px solid var(--border); background: var(--surface-2);
                  border-radius: var(--r-md); padding: 12px 14px; }
    .share-made .ct { display: flex; align-items: center; gap: 7px; font-weight: 600;
                      font-size: 13px; color: var(--good); }
    .share-made .ct svg { width: 15px; height: 15px; }
    .share-made .secret-val { font-size: 12.5px; letter-spacing: 0; }
    .share-list { border-top: 1px solid var(--border-soft); }
    .share-row { display: flex; align-items: center; gap: 10px; padding: 9px 18px; font-size: 12.5px;
                 border-bottom: 1px solid var(--border-soft); flex-wrap: wrap; }
    .share-row:last-child { border-bottom: 0; }
    .share-row svg { width: 14px; height: 14px; color: var(--text-faint); }
    .share-row:not(.open) { opacity: .6; }
    .share-row .btn { margin-left: auto; }
    .share-row.more { opacity: 1; }

    /* ---- exporting a customer ---- */
    .export-panel { margin-bottom: 16px; }

    /* ---- configuration types under their section in the sidebar ---- */
    .nav button.nav-sub { padding-left: 34px; font-size: 12.5px; min-height: 30px; }
    .nav button.nav-sub svg { width: 14px; height: 14px; }
    .nav button .nav-fold { display: inline-flex; margin: -3px -4px -3px 2px; padding: 3px; border-radius: 5px;
                            color: var(--text-faint); }
    .nav button .nav-fold:hover { background: var(--surface-2); color: var(--text); }
    .nav button .nav-fold svg { width: 14px; height: 14px; opacity: 1; transition: transform .15s; }
    .nav button .nav-fold.folded svg { transform: rotate(-90deg); }
    .nav button .nav-fold.hidden { display: none; }
    /* Headings in the sidebar, each folding its sections away. */
    .nav-group { margin-top: 8px; }
    .nav button.nav-group-head { min-height: 26px; padding: 4px 10px 4px 12px; font-size: 10.5px; font-weight: 650;
                                 letter-spacing: .07em; text-transform: uppercase; color: var(--text-faint); gap: 6px; }
    .nav button.nav-group-head:hover { color: var(--text-dim); background: transparent; }
    .nav button.nav-group-head svg { width: 13px; height: 13px; margin-left: 2px; transition: transform .15s; }
    .nav-group-n { margin-left: auto; font-size: 10.5px; letter-spacing: 0; font-weight: 500; }
    .nav-group:not(.folded) .nav-group-n { display: none; }
    .nav-group:not(.folded) .nav-group-head svg { margin-left: auto; }
    .nav-group.folded .nav-group-head svg { transform: rotate(-90deg); }
    .nav-group.folded .nav-group-items { display: none; }
    .tc-subs { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
    .tc-subs .tag svg { width: 11px; height: 11px; margin-right: 4px; }

    /* ---- the header's menus, as in the RMM ---- */
    .hwrap { position: relative; }
    .hmenu { position: absolute; right: 0; top: calc(100% + 8px); min-width: 210px; background: var(--surface);
             border: 1px solid var(--border); border-radius: var(--r-md); box-shadow: var(--shadow-lg); padding: 6px;
             opacity: 0; transform: translateY(-6px); pointer-events: none; transition: .15s; z-index: 50; }
    .hmenu.open { opacity: 1; transform: none; pointer-events: auto; }
    .hmenu a { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: var(--r-sm);
               color: var(--text); text-decoration: none; font-size: 13px; cursor: pointer; }
    .hmenu a:hover { background: var(--surface-hover); }
    .hmenu a svg { width: 16px; height: 16px; color: var(--text-dim); flex: none; }
    .hmenu-sep { height: 1px; background: var(--border); margin: 5px 4px; }
    .bell-menu { width: 340px; }
    .bell-menu .bm-head { padding: 8px 11px 6px; font-size: 12px; color: var(--text-faint); font-weight: 600; }
    .bell-menu a { align-items: flex-start; }
    .bell-menu .bm-text { flex: 1; min-width: 0; line-height: 1.35; }
    .bell-menu .bm-text small { display: block; color: var(--text-faint); font-size: 11.5px; }
    .bell-menu .tag { margin-left: auto; flex: none; }
    .bell-menu .bm-none { padding: 12px 11px; font-size: 13px; color: var(--text-dim); }
    #rmm-btn { text-decoration: none; }
    #rmm-ico { display: inline-flex; width: 15px; height: 15px; }
    #rmm-ico svg { width: 15px; height: 15px; }
    .icon-btn { position: relative; }

    /* ---- linking with the RMM ---- */
    .pair-row { display: flex; gap: 8px; }
    .pair-row .inp { flex: 1; }

    /* ---- back-ups ---- */
    .bk-table td { vertical-align: middle; }
    .bk-actions { text-align: right; white-space: nowrap; }
    .bk-actions .btn { margin-left: 4px; vertical-align: middle; }
    .bk-form td { background: var(--surface-2); }
    .bk-inline { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .bk-inline .inp { max-width: 260px; }
    .blk-foot label.btn { cursor: pointer; }

    /* ---- the vault across customers ---- */
    .tag.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
    .vault-sum { padding: 16px 20px; margin-bottom: 16px; }
    .vs-line { display: flex; gap: 8px; align-items: baseline; font-size: 14px; }
    .vault-grades { display: flex; height: 8px; border-radius: 99px; overflow: hidden;
                    background: var(--surface-3); margin: 12px 0 10px; }
    .vault-grades span { display: block; height: 100%; }
    .vs-legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 12.5px; color: var(--text-dim); }
    .vs-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 6px; }
    .g-ok { background: var(--good); } .g-mid { background: var(--warn); }
    .g-bad { background: var(--bad); } .g-none { background: var(--text-faint); }
    .vault-tiles { margin-bottom: 16px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
    .vault-tile { padding: 16px 18px; }
    .vault-tile .oc-head { margin-bottom: 0; }
    .vault-tile .oc-mark { background: var(--surface-3); color: var(--text-dim); }
    .vault-tile .oc-mark svg { width: 18px; height: 18px; }
    .vault-tile.bad .oc-mark { background: var(--bad-soft); color: var(--bad); }
    .vault-tile.warn .oc-mark { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); }
    .vault-tile h3 { font-size: 22px; line-height: 1.1; }
    .vault-sec { margin-bottom: 16px; scroll-margin-top: 80px; }
    .vault-row { display: flex; align-items: center; gap: 10px; padding: 10px 18px; font-size: 13px;
                 border-top: 1px solid var(--border-soft); cursor: pointer; flex-wrap: wrap; }
    .vault-row:hover { background: var(--surface-2); }
    .vault-row .vr-org { color: var(--text-dim); min-width: 150px; }
    .vault-row .vr-name { font-weight: 600; }
    .vault-row .vr-end { margin-left: auto; display: flex; gap: 10px; align-items: center; }
    .vault-group + .vault-group { border-top: 1px solid var(--border); }
    .vault-group .vg-head { padding: 12px 18px 8px; font-size: 12.5px; color: var(--text-dim); }
    .vault-none { display: flex; align-items: center; gap: 8px; padding: 14px 18px; font-size: 13px;
                  color: var(--text-dim); border-top: 1px solid var(--border-soft); }
    .vault-none svg { width: 15px; height: 15px; color: var(--good); }
    .secret-panel .panel-head .sx-grade { cursor: help; }
    .share-row.more .btn { margin-left: 0; }
  </style>
</head>
