services:
  leuffendoc:
    image: ${DOC_IMAGE:-ghcr.io/mischa323/leuffendoc:latest}
    # To build from source instead, uncomment:
    # build:
    #   context: .
    #   dockerfile: server/Dockerfile
    ports:
      - "8100:8000"
    # Nothing else is needed: the first visit opens a set-up screen (the code it
    # asks for is printed in this container's log), and everything is kept in
    # /data. Environment variables still work and win over saved values -- see
    # the README -- for pinning a value or getting back in, e.g.:
    # environment:
    #   DOC_BOOTSTRAP_ADMIN: "you@example.com"
    #   DOC_SECRET_KEY: "..."        # keep the vault's key out of the database
    volumes:
      - ./data:/data
    restart: unless-stopped
