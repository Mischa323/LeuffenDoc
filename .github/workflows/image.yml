name: Build & publish image

# Builds the LeuffenDoc image and pushes it to GitHub Container Registry
# (ghcr.io/<owner>/leuffendoc), which is what docker-compose.yml pulls.

on:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths:
      - "server/**"
      - "requirements.txt"
      - "VERSION"
      - "docker-compose.yml"
      - ".github/workflows/image.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  # The image is only built when the tests pass: a broken release should stop
  # here, not on somebody's server.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt pytest

      - name: Test
        run: python -m pytest -q server/tests

  build-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # so 'git describe' resolves a meaningful version

      - name: Resolve version
        id: ver
        run: |
          if [ -f VERSION ]; then v=$(tr -d ' \n' < VERSION | sed 's/^v//');
          else v=$(git describe --tags --always | sed 's/^v//'); fi
          echo "v=$v" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          build-args: |
            DOC_VERSION=${{ steps.ver.outputs.v }}
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ steps.ver.outputs.v }}
